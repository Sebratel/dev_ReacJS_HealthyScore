server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Compressão para texto (NÃO inclui octet-stream → o snapshot .data fica intacto)
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Assets com hash no nome (ex.: /assets/index-AbC123.js) → cache longo e imutável
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Snapshot de dados: já é gzip (descomprimido no cliente). Serve cru, sem
    # transformar, e sempre revalida — assim a atualização diária aparece na hora.
    location = /realClients.data {
        default_type application/octet-stream;
        gzip off;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # index.html nunca em cache → o navegador sempre pega o build mais novo
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Backend de queries — proxy para o serviço `api` da stack (porta 8787).
    # Repassa a URI completa (/api/...), então as rotas do backend batem direto.
    location /api/ {
        # Configs das engines (índices dinâmicos sobre a base completa) podem
        # gerar corpos grandes no POST /api/dashboard e /api/engine.
        client_max_body_size 12m;
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota desconhecida cai no index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
