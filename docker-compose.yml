# Health Score Sebratel — stack de produção (SPA estática via nginx + API de queries).
# Deploy no Portainer: Stacks → Add stack → Repository → branch main.
# Defina VITE_GOOGLE_CLIENT_ID (e, se quiser, QUERY_EDITOR_EMAILS) nas
# "Environment variables" da stack.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Client ID público do Google OAuth (variável de build do Vite).
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    image: healthyscore-web:latest
    # Imagem construída localmente (não existe em registry) → sempre buildar,
    # nunca puxar. Evita o 'pull access denied' no redeploy do Portainer.
    pull_policy: build
    container_name: healthyscore-web
    restart: unless-stopped
    networks:
      - churniq
    # Só entra no ar depois que o backend responde ao healthcheck — assim o
    # proxy /api/ do nginx nunca sobe apontando para uma API ainda indisponível.
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Porta do host (esquerda) configurável; 80 é a porta interna do nginx.
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Backend de queries — serve/edita o catálogo de queries do ETL. O nginx do
  # `web` faz proxy de /api/ para cá. Os overrides ficam em ./data (volume),
  # compartilhado com a máquina/job que roda o ETL (fetch-clients.mjs).
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: churniq-api:latest
    pull_policy: build
    container_name: churniq-api
    restart: unless-stopped
    networks:
      - churniq
    environment:
      API_PORT: 8787
      # Domínio de e-mail permitido para acessar (todos @domínio = viewer).
      ALLOWED_DOMAIN: ${ALLOWED_DOMAIN:-sebratel.com.br}
      # ── Controle de acesso (RBAC) ──
      # Admins SEMENTE (CSV) — sempre admin, não removíveis pela tela. Garante
      # que sempre haja alguém pra abrir "Usuários e Acessos".
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Power users de bootstrap por env (CSV). Opcional — o resto é gerido na tela.
      POWER_USER_EMAILS: ${POWER_USER_EMAILS:-}
      # Legado: QUERY_EDITOR_EMAILS ainda conta como power_user (compat).
      QUERY_EDITOR_EMAILS: ${QUERY_EDITOR_EMAILS:-}
      # Papéis geridos pela tela (volume compartilhado, persiste entre deploys).
      ROLES_PATH: /app/data/roles.json
      QUERY_OVERRIDES_PATH: /app/data/query-overrides.json
      # Base materializada (snapshot gerado pelo `etl`) que o backend carrega em
      # memória. A `api` NÃO acessa mais o banco — tudo vem do snapshot.
      SNAPSHOT_PATH: /snapshot/realClients.data
    volumes:
      - ./data:/app/data
      - snapshot:/snapshot:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Job do ETL — gera o snapshot COMPLETO da base 1x por dia de madrugada
  # (fetch-clients.mjs full) e grava no volume `snapshot`, compartilhado com a
  # `api`. Bootstrap: se o volume estiver vazio, roda uma vez ao subir.
  etl:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: churniq-api:latest
    pull_policy: build
    container_name: churniq-etl
    restart: unless-stopped
    networks:
      - churniq
    command: ["node", "scripts/etl-scheduler.mjs"]
    environment:
      SNAPSHOT_OUT: /snapshot/realClients.data
      QUERY_OVERRIDES_PATH: /app/data/query-overrides.json
      # Hora local da execução diária (0-23). Force uma execução ao subir com
      # ETL_RUN_ON_START=true (além do bootstrap quando o volume está vazio).
      ETL_HOUR: ${ETL_HOUR:-3}
      ETL_RUN_ON_START: ${ETL_RUN_ON_START:-}
      # Bancos usados pelo ETL (read-only recomendado). Preencha na stack.
      DB_ELLEVEN_HOST: ${DB_ELLEVEN_HOST:-}
      DB_ELLEVEN_DATABASE: ${DB_ELLEVEN_DATABASE:-}
      DB_ELLEVEN_USER: ${DB_ELLEVEN_USER:-}
      DB_ELLEVEN_PASSWORD: ${DB_ELLEVEN_PASSWORD:-}
      DB_ELLEVEN_PORT: ${DB_ELLEVEN_PORT:-5432}
      DB_ELLEVEN_SSL: ${DB_ELLEVEN_SSL:-}
      DB_MARIA_HOST: ${DB_MARIA_HOST:-}
      DB_MARIA_DATABASE: ${DB_MARIA_DATABASE:-}
      DB_MARIA_USER: ${DB_MARIA_USER:-}
      DB_MARIA_PASSWORD: ${DB_MARIA_PASSWORD:-}
      DB_MARIA_PORT: ${DB_MARIA_PORT:-3306}
      # Banco AutoISP (quedas de PPPoE / status da ONU) — opcional: sem as
      # variáveis o ETL roda normalmente, apenas sem o sinal de ONU.
      DB_AUTOISP_HOST: ${DB_AUTOISP_HOST:-}
      DB_AUTOISP_DATABASE: ${DB_AUTOISP_DATABASE:-}
      DB_AUTOISP_USER: ${DB_AUTOISP_USER:-}
      DB_AUTOISP_PASSWORD: ${DB_AUTOISP_PASSWORD:-}
      DB_AUTOISP_PORT: ${DB_AUTOISP_PORT:-5432}
      DB_AUTOISP_SSL: ${DB_AUTOISP_SSL:-}
    volumes:
      - ./data:/app/data
      - snapshot:/snapshot

# Rede interna dedicada da stack. O nginx do `web` resolve o backend pelo nome
# do serviço (`api`) dentro dela — é isso que faz o proxy /api/ funcionar.
# Subir a stack inteira (front + backend) é um comando só:
#   docker compose up -d --build
networks:
  churniq:
    driver: bridge

# Volume do snapshot completo: o `etl` grava, a `api` lê (materialização em
# memória). Sobrevive a redeploys — os dados atualizam sozinhos de madrugada.
volumes:
  snapshot:
